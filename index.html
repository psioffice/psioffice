<style>
  :root {
    --azul-profundo: #2d3e50;
    --azul-medio: #25627c;
    --azul-claro: #6997a6;
    --arena: #eee8dc;
    --arena-dark: #e2dccd;
    --arena-light: #f7f3ea;
    --blanco: #ffffff;
    --text: #1f2937;
    --text-light: #6b7280;
    --text-muted: #9ca3af;
    --border: #e4ddd0;
    --success: #4a7c59;
    --warning: #c89b3c;
    --danger: #a84242;
    --shadow: 0 1px 3px rgba(45, 62, 80, 0.08);
    --shadow-lg: 0 4px 12px rgba(45, 62, 80, 0.12);
    --radius: 14px;
    --radius-sm: 10px;
    --font-serif: 'Fraunces', Georgia, serif;
    --font-sans: 'Manrope', -apple-system, BlinkMacSystemFont, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: var(--font-sans);
    background: var(--arena);
    color: var(--text);
    height: 100vh;
    overflow: hidden;
    font-weight: 400;
    font-size: 14px;
  }
  body.dark {
    --arena: #1a2530;
    --arena-dark: #141d26;
    --arena-light: #223040;
    --blanco: #2d3e50;
    --text: #eee8dc;
    --text-light: #a8b4c0;
    --text-muted: #6b7a8a;
    --border: #3a4d60;
  }
  h1, h2, h3, h4 { font-family: var(--font-serif); font-weight: 500; letter-spacing: -0.01em; }
  #app { display: flex; flex-direction: column; height: 100vh; }
  header {
    background: var(--azul-profundo);
    color: var(--arena);
    padding: 14px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: var(--shadow);
  }
  .logo { display: flex; align-items: center; gap: 12px; }
  .logo-wave {
    width: 36px; height: 36px;
    background: var(--arena);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
  }
  .logo-wave svg { width: 24px; height: 24px; }
  .logo-text {
    font-family: var(--font-serif);
    font-weight: 400;
    font-size: 18px;
    line-height: 1.1;
  }
  .logo-text small { display: block; font-family: var(--font-sans); font-size: 10px; font-weight: 500; opacity: 0.7; text-transform: uppercase; letter-spacing: 0.1em; margin-top: 2px; }
  .header-actions { display: flex; gap: 8px; align-items: center; }
  .layout { display: flex; flex: 1; overflow: hidden; }
  aside {
    width: 260px;
    background: var(--arena-light);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .nav-section { padding: 10px 8px; border-bottom: 1px solid var(--border); }
  .nav-section-title { font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-muted); padding: 6px 12px; font-weight: 600; }
  .nav-btn {
    display: flex; align-items: center; gap: 10px;
    width: 100%; padding: 10px 12px;
    background: transparent; border: none;
    border-radius: var(--radius-sm);
    cursor: pointer; text-align: left;
    color: var(--text); font-size: 13.5px; font-weight: 500;
    font-family: var(--font-sans);
    transition: background 0.15s;
  }
  .nav-btn:hover { background: var(--arena-dark); }
  .nav-btn.active { background: var(--azul-profundo); color: var(--arena); }
  .nav-btn .nav-icon { width: 18px; text-align: center; }
  .search-box { padding: 10px 12px; }
  .search-box input {
    width: 100%; padding: 9px 12px;
    border: 1px solid var(--border); border-radius: var(--radius-sm);
    font-size: 13px; background: var(--blanco);
    font-family: var(--font-sans);
  }
  .patient-list { flex: 1; overflow-y: auto; padding: 4px 8px; }
  .patient-item {
    padding: 10px 12px; border-radius: var(--radius-sm);
    cursor: pointer; margin-bottom: 3px;
    display: flex; justify-content: space-between; align-items: center;
    font-size: 13.5px; font-weight: 500;
  }
  .patient-item:hover { background: var(--arena-dark); }
  .patient-item.active { background: var(--azul-claro); color: var(--arena); }
  .patient-item .badge {
    background: var(--warning); color: white;
    font-size: 10px; padding: 2px 7px; border-radius: 10px; font-weight: 700;
  }
  .new-patient-btn {
    margin: 10px 12px;
    padding: 10px; background: var(--azul-profundo); color: var(--arena);
    border: none; border-radius: var(--radius-sm);
    font-weight: 600; cursor: pointer; font-size: 13px;
    font-family: var(--font-sans);
  }
  .new-patient-btn:hover { background: var(--azul-medio); }
  main { flex: 1; overflow-y: auto; background: var(--arena); }
  .empty-state {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    height: 100%; color: var(--text-light); text-align: center; padding: 60px;
  }
  .empty-state h2 { font-size: 28px; margin-bottom: 12px; color: var(--azul-profundo); font-style: italic; }
  .empty-state p { max-width: 400px; line-height: 1.6; }
  .patient-header {
    background: var(--arena-light);
    padding: 24px 32px 0;
    border-bottom: 1px solid var(--border);
  }
  .patient-header h1 { font-size: 30px; color: var(--azul-profundo); font-weight: 400; margin-bottom: 4px; }
  .patient-header .subtitle { color: var(--text-light); font-size: 13px; }
  .patient-actions { display: flex; gap: 8px; margin-top: 14px; padding-bottom: 14px; }
  .tabs {
    background: var(--arena-light);
    display: flex;
    border-bottom: 1px solid var(--border);
    padding: 0 24px;
    overflow-x: auto;
  }
  .tab {
    padding: 12px 14px; background: transparent; border: none;
    border-bottom: 2px solid transparent;
    cursor: pointer; font-size: 13px; color: var(--text-light);
    font-weight: 500; white-space: nowrap;
    font-family: var(--font-sans);
  }
  .tab.active { color: var(--azul-profundo); border-bottom-color: var(--azul-profundo); font-weight: 600; }
  .tab-content { padding: 28px 32px; max-width: 1200px; }
  .card {
    background: var(--blanco);
    border-radius: var(--radius);
    padding: 22px;
    margin-bottom: 16px;
    box-shadow: var(--shadow);
    border: 1px solid var(--border);

  .card h3 { font-size: 18px; color: var(--azul-profundo); margin-bottom: 16px; font-weight: 500; }
  .card h4 { font-size: 15px; color: var(--azul-medio); margin-bottom: 10px; font-weight: 600; font-family: var(--font-sans); }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; }
  .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
  label {
    display: block; font-size: 11px; font-weight: 600;
    color: var(--text-light); margin-bottom: 5px;
    text-transform: uppercase; letter-spacing: 0.05em;
  }
  input, textarea, select {
    width: 100%; padding: 9px 12px;
    border: 1px solid var(--border); border-radius: 8px;
    font-size: 14px; font-family: var(--font-sans);
    background: var(--blanco); color: var(--text);
  }
  textarea { resize: vertical; min-height: 80px; line-height: 1.5; }
  input:focus, textarea:focus, select:focus { outline: none; border-color: var(--azul-medio); box-shadow: 0 0 0 3px rgba(37, 98, 124, 0.1); }
  .field { margin-bottom: 14px; }
  .btn {
    padding: 9px 16px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--blanco);
    cursor: pointer; font-size: 13px; font-weight: 600;
    display: inline-flex; align-items: center; gap: 6px;
    font-family: var(--font-sans); color: var(--text);
    transition: all 0.15s;
  }
  .btn:hover { background: var(--arena-dark); }
  .btn-primary { background: var(--azul-profundo); color: var(--arena); border-color: var(--azul-profundo); }
  .btn-primary:hover { background: var(--azul-medio); }
  .btn-secondary { background: var(--azul-claro); color: white; border-color: var(--azul-claro); }
  .btn-secondary:hover { opacity: 0.9; background: var(--azul-claro); }
  .btn-danger { background: var(--blanco); color: var(--danger); border-color: var(--danger); }
  .btn-danger:hover { background: var(--danger); color: white; }
  .btn-success { background: var(--success); color: white; border-color: var(--success); }
  .btn-success:hover { opacity: 0.9; background: var(--success); }
  .btn-ghost { background: transparent; border-color: transparent; }
  .save-status { font-size: 12px; color: var(--success); margin-left: 10px; opacity: 0; transition: opacity 0.3s; }
  .save-status.visible { opacity: 1; }
  /* Session item */
  .session-item-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; padding-bottom: 10px; border-bottom: 1px solid var(--border); }
  .session-item-header .date { font-weight: 600; color: var(--azul-profundo); font-size: 15px; }
  .status { font-size: 11px; padding: 3px 10px; border-radius: 12px; font-weight: 600; }
  .status.paid { background: #e8f0e9; color: var(--success); }
  .status.pending { background: #fbf2d8; color: var(--warning); }
  /* Genogram */
  .genogram-toolbar { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; padding: 12px; background: var(--arena-light); border-radius: var(--radius-sm); border: 1px solid var(--border); }
  #genogramCanvas { background: var(--blanco); border: 1px solid var(--border); border-radius: var(--radius-sm); width: 100%; height: 600px; cursor: default; }
  .genogram-node { cursor: move; }
  .genogram-hint { font-size: 12.5px; color: var(--text-light); padding: 10px 14px; background: var(--arena-light); border-radius: var(--radius-sm); margin-bottom: 12px; line-height: 1.5; }
  /* Modal */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(45, 62, 80, 0.5);
    display: flex; align-items: center; justify-content: center;
    z-index: 1000; backdrop-filter: blur(3px);
  }
  .modal {
    background: var(--blanco); border-radius: var(--radius);
    padding: 28px; min-width: 420px; max-width: 90vw;
    max-height: 90vh; overflow-y: auto;
    box-shadow: var(--shadow-lg);
  }
  .modal h2 { margin-bottom: 18px; color: var(--azul-profundo); font-size: 22px; }
  .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 22px; }
  /* Stat cards */
  .stat-card { background: var(--blanco); border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow); border: 1px solid var(--border); }
  .stat-card.highlight { background: var(--azul-profundo); color: var(--arena); border-color: var(--azul-profundo); }
  .stat-card.highlight .stat-label, .stat-card.highlight .stat-value { color: var(--arena); }
  .stat-value { font-family: var(--font-serif); font-size: 32px; font-weight: 500; color: var(--azul-profundo); line-height: 1; }
  .stat-label { color: var(--text-light); font-size: 12.5px; margin-top: 6px; font-weight: 500; }
  .stat-sub { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
  /* Alerts */
  .alert-item {
    padding: 12px 14px; border-radius: var(--radius-sm);
    margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center;
    background: var(--arena-light); border: 1px solid var(--border);
  }
  .alert-item.warning { background: #fdf6e3; border-color: #efdca5; border-left: 4px solid var(--warning); }
  .alert-item.danger { background: #fae9e9; border-color: #e8bcbc; border-left: 4px solid var(--danger); }
  .alert-item.info { background: #e8eff4; border-color: #c4d6e0; border-left: 4px solid var(--azul-medio); }
  .alert-item.success { background: #e8f0e9; border-color: #bed2c3; border-left: 4px solid var(--success); }
  .legend-item { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-light); }
  .legend-symbol { width: 20px; height: 20px; }
  .toast {
    position: fixed; bottom: 20px; right: 20px;
    background: var(--azul-profundo); color: var(--arena);
    padding: 12px 20px; border-radius: 10px; z-index: 2000;
    opacity: 0; transform: translateY(10px); transition: all 0.3s;
    box-shadow: var(--shadow-lg);
  }
  .toast.visible { opacity: 1; transform: translateY(0); }
  .row { display: flex; gap: 8px; align-items: center; }
  .checkbox-row { display: flex; align-items: center; gap: 6px; }
  .checkbox-row input { width: auto; }
  .commission-row {
    display: grid; grid-template-columns: 2fr 1fr 1fr 1fr auto;
    gap: 10px; padding: 10px;
    border-bottom: 1px solid var(--border); align-items: center; font-size: 14px;
  }
  .commission-row.header { font-weight: 600; background: var(--arena-light); border-radius: 6px; color: var(--azul-profundo); }
  .progress-bar { width: 100%; height: 10px; background: var(--arena-dark); border-radius: 10px; overflow: hidden; margin-top: 8px; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, var(--azul-medio), var(--azul-claro)); transition: width 0.4s; }
  .checklist-item { display: flex; align-items: flex-start; gap: 10px; padding: 10px; background: var(--arena-light); border-radius: 8px; margin-bottom: 6px; }
  .checklist-item input { width: auto; margin-top: 3px; }
  .checklist-item label { margin: 0; text-transform: none; letter-spacing: normal; font-size: 13.5px; color: var(--text); font-weight: 500; line-height: 1.4; }
  .pill { display: inline-block; padding: 3px 10px; border-radius: 12px; font-size: 11px; font-weight: 600; background: var(--arena-dark); color: var(--azul-profundo); }
  .divider { height: 1px; background: var(--border); margin: 16px 0; }
  details { background: var(--arena-light); border-radius: var(--radius-sm); padding: 12px 16px; margin-bottom: 8px; }
  summary { cursor: pointer; font-weight: 600; color: var(--azul-profundo); }
  details[open] summary { margin-bottom: 10px; }
</style>
</head>
<body>
<div id="loginScreen" style="display: none; min-height: 100vh; background: linear-gradient(135deg, var(--azul-profundo) 0%, var(--azul-medio) 100%); padding: 40px 20px; overflow-y: auto;">

<script>
// ==================== PROFILES & ENCRYPTION ====================
const PROFILES_KEY = 'theralink_profiles';
let currentProfileId = null;
let encryptionKey = null;
let data = null;

function loadProfiles() {
  try { return JSON.parse(localStorage.getItem(PROFILES_KEY)) || { profiles: [] }; }
  catch (e) { return { profiles: [] }; }
}
function saveProfilesList(p) { localStorage.setItem(PROFILES_KEY, JSON.stringify(p)); }

async function deriveKey(password, saltBase64) {
  const enc = new TextEncoder();
  const salt = Uint8Array.from(atob(saltBase64), c => c.charCodeAt(0));
  const keyMaterial = await crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: 100000, hash: 'SHA-256' }, keyMaterial, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
}
function randomBase64(bytes) {
  const arr = crypto.getRandomValues(new Uint8Array(bytes));
  return btoa(String.fromCharCode(...arr));
}
async function encryptJSON(key, obj) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const enc = new TextEncoder();
  const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, enc.encode(JSON.stringify(obj)));
  return { iv: btoa(String.fromCharCode(...iv)), ct: btoa(String.fromCharCode(...new Uint8Array(ct))) };
}
async function decryptJSON(key, { iv, ct }) {
  const ivBuf = Uint8Array.from(atob(iv), c => c.charCodeAt(0));
  const ctBuf = Uint8Array.from(atob(ct), c => c.charCodeAt(0));
  const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: ivBuf }, key, ctBuf);
  return JSON.parse(new TextDecoder().decode(pt));
}

// ==================== LOGIN UI ====================
function showLogin() {
  document.getElementById('loginScreen').style.display = '';
  document.getElementById('app').style.display = 'none';
  renderProfilesList();
}
function hideLogin() {
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
}

function renderProfilesList() {
  const prof = loadProfiles();
  const el = document.getElementById('loginContent');
  if (prof.profiles.length === 0) return renderCreateFirstProfile();
  el.innerHTML = `
    <h2 style="color: var(--azul-profundo); font-size: 20px; margin-bottom: 16px;">Elegí tu perfil</h2>
    ${prof.profiles.map(p => `
      <button onclick="openProfile('${p.id}')" style="display: flex; align-items: center; gap: 12px; width: 100%; padding: 14px 16px; margin-bottom: 8px; background: var(--arena-light); border: 1px solid var(--border); border-radius: 12px; cursor: pointer; text-align: left; font-family: var(--font-sans); transition: all 0.15s;" onmouseover="this.style.borderColor='var(--azul-medio)'" onmouseout="this.style.borderColor='var(--border)'">
        <div style="width: 40px; height: 40px; background: var(--azul-profundo); color: var(--arena); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 600;">${escapeHtml((p.name||'?').charAt(0).toUpperCase())}</div>
        <div style="flex: 1;">

async function tryLogin(profileId) {
  const prof = loadProfiles().profiles.find(p => p.id === profileId);
  const pass = document.getElementById('loginPass').value;
  if (!pass) return;
  try {
    const key = await deriveKey(pass, prof.salt);
    const raw = localStorage.getItem('theralink_data_' + profileId);
    if (raw) {
      const payload = JSON.parse(raw);
      const decrypted = await decryptJSON(key, payload);
      migrateData(decrypted);
      data = decrypted;
    } else { data = defaultData(); }
    currentProfileId = profileId;
    encryptionKey = key;
    afterLogin();
  } catch (e) {
    toast('Contraseña incorrecta');
    document.getElementById('loginPass').value = '';
  }
}

function afterLogin() {
  hideLogin();
  if (data.settings.darkMode) document.body.classList.add('dark');

  currentView = 'home';
  renderSidebar();
  renderMain();
  startReminderCheck();
}

function logout() {
  if (!confirm('¿Cerrar sesión? Los datos no se pierden.')) return;
  currentProfileId = null;
  encryptionKey = null;
  data = null;
  stopReminderCheck();
  showLogin();
}

  localStorage.removeItem('theralink_data_' + currentProfileId);

}

async function doImportProfile() {
  const file = document.getElementById('impFile').files[0];
  const pass = document.getElementById('impPass').value;
  if (!file) return toast('Elegí un archivo');
  if (!pass) return toast('Poné la contraseña');
  const txt = await file.text();
  try {
    const pkg = JSON.parse(txt);
    if (!pkg.theralinkBackup && !pkg.psiofficeBackup) return toast('Archivo inválido');
    const key = await deriveKey(pass, pkg.salt);
    const decrypted = await decryptJSON(key, pkg.payload);
    migrateData(decrypted);
    // create profile
    const prof = loadProfiles();
    const newP = { id: 'p_'+Date.now().toString(36)+Math.random().toString(36).slice(2,6), name: pkg.profileName || 'Importado', hasPassword: true, salt: pkg.salt, createdAt: new Date().toISOString() };
    prof.profiles.push(newP);
    saveProfilesList(prof);
    currentProfileId = newP.id;
    encryptionKey = key;
    data = decrypted;
    await saveData();
    afterLogin();
    toast('✓ Perfil importado');
  } catch (e) {
    toast('Error al importar: ¿contraseña incorrecta o archivo dañado?');
  }
}

async function exportProfilePackage() {
  const prof = loadProfiles().profiles.find(p => p.id === currentProfileId);
  if (!prof) return;
  const payload = await encryptJSON(encryptionKey, data);
  const pkg = { psiofficeBackup: true, theralinkBackup: true, version: 2, profileName: prof.name, salt: prof.salt, payload, exportedAt: new Date().toISOString() };
  const blob = new Blob([JSON.stringify(pkg)], { type: 'application/octet-stream' });
  saveAs(blob, `perfil_${sanitize(prof.name)}_${new Date().toISOString().split('T')[0]}.psioffice`);
  toast('✓ Perfil exportado (guardalo en Drive o USB para abrirlo en otro dispositivo)');
}

function migrateData(d) {
  const defaults = defaultData();
  if (!d.settings) d.settings = defaults.settings;
  // merge missing settings fields only (don't overwrite existing)
  for (const k of Object.keys(defaults.settings)) if (d.settings[k] === undefined) d.settings[k] = defaults.settings[k];
  if (!d.settings.vacation) d.settings.vacation = defaults.settings.vacation;
  if (!d.settings.whatsappTemplates || d.settings.whatsappTemplates.length === 0) d.settings.whatsappTemplates = defaults.settings.whatsappTemplates;
  if (!d.patients) d.patients = [];
  if (!d.insurers) d.insurers = [];
  if (!d.cierreHistory) d.cierreHistory = [];
  if (!d.waitlist) d.waitlist = [];
  for (const p of d.patients) {
    if (!p.insurance) p.insurance = { provider: '', planNumber: '', copay: 0 };
    if (!p.insuranceClaims) p.insuranceClaims = [];
    if (!p.evolutionNotes) p.evolutionNotes = [];
    if (!p.consent) p.consent = { signed: false, date: '', notes: '' };
    if (!p.receipts) p.receipts = [];
    if (!p.goals) p.goals = [];
    if (!p.network) p.network = [];
    for (const s of p.sessions || []) {
      if (s.insurerClaimId === undefined) s.insurerClaimId = null;
    }
  }
}

async function structureNotesWithAI(sourceText, context) {
  if (!data.settings.openaiKey) {
    toast('Primero cargá tu API key de OpenAI en Ajustes');
    openSettings();
    return null;
  }
  if (!sourceText || sourceText.trim().length < 10) {
    toast('Escribí al menos unas líneas de notas crudas primero');
    return null;
  }
  const prompt = `Sos un/a asistente clínico/a para profesionales de la salud mental. Tomás notas crudas de una sesión de psicoterapia (lenguaje coloquial, desordenado, con faltas) y las estructurás en formato clínico profesional, respetando la Ley 26.529 de Argentina. NO inventes información que no esté en el texto original. NO des diagnósticos propios. Mantené el contenido clínico original pero mejorá redacción, ortografía, y organizalo en estas 4 secciones con títulos exactos (en MAYÚSCULAS seguido de dos puntos):

OBSERVACIONES: lo que la persona trajo, cómo se presentó, emergentes principales.
INTERVENCIONES: qué hiciste vos como terapeuta, técnicas o abordajes aplicados.
TAREAS / CONSIGNAS: lo acordado para trabajar entre sesiones (si aplica).
PLAN PRÓXIMA SESIÓN: líneas que quedaron abiertas y hacia dónde vas.

Si alguna sección no aplica, escribí "No aplica". Mantené lenguaje profesional, respetuoso, no patologizante.

NOTAS CRUDAS:
${sourceText}`;

  showAILoading();
  try {
    const res = await fetch('https://api.openai.com/v1/chat/completions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + data.settings.openaiKey },
      body: JSON.stringify({ model: data.settings.aiModel || 'gpt-4o-mini', messages: [{ role: 'user', content: prompt }], temperature: 0.3 })
    });
    const json = await res.json();
    if (json.error) { hideAILoading(); toast('Error IA: ' + json.error.message); return null; }
    const result = json.choices?.[0]?.message?.content || '';
    hideAILoading();
    return result;
  } catch (e) {
    hideAILoading();
    toast('Error de conexión con OpenAI: ' + e.message);
    return null;
  }
}

function showAILoading() {
  const d = document.createElement('div');
  d.id = 'aiLoadingOverlay';
  d.style.cssText = 'position:fixed;inset:0;background:rgba(45,62,80,0.6);display:flex;align-items:center;justify-content:center;z-index:3000;';
  d.innerHTML = `<div style="background:var(--blanco);padding:30px 40px;border-radius:14px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,0.3);"><div style="font-size:32px;animation:spin 1.5s linear infinite;display:inline-block;">✨</div><div style="margin-top:12px;color:var(--azul-profundo);font-weight:600;">Estructurando tus notas...</div><div style="font-size:12px;color:var(--text-light);margin-top:4px;">Puede tardar 5-15 segundos</div></div><style>@keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}</style>`;
  document.body.appendChild(d);
}
function hideAILoading() { document.getElementById('aiLoadingOverlay')?.remove(); }

async function aiStructureSessionNotes(sessionId) {
  const p = getPatient(currentPatientId);
  const s = p.sessions.find(x => x.id === sessionId); if (!s) return;
  const raw = [s.notes, s.interventions ? 'Intervenciones: '+s.interventions : '', s.homework ? 'Tareas: '+s.homework : ''].filter(Boolean).join('\n\n');
  const result = await structureNotesWithAI(raw, 'session');
  if (!result) return;
  showStructuredResultModal(result, (parsed) => {
    s.notes = parsed.observaciones || s.notes;
    s.interventions = parsed.intervenciones || s.interventions;
    s.homework = parsed.tareas || s.homework;
    saveData(); renderTabContent();
  });
}

async function aiStructureEvolutionNote(noteId) {
  const p = getPatient(currentPatientId);
  const n = p.evolutionNotes.find(x => x.id === noteId); if (!n) return;
  const raw = [n.motive ? 'Motivo: '+n.motive : '', n.content, n.interventions ? 'Intervenciones: '+n.interventions : '', n.plan ? 'Plan: '+n.plan : ''].filter(Boolean).join('\n\n');
  const result = await structureNotesWithAI(raw, 'evolution');
  if (!result) return;
  showStructuredResultModal(result, (parsed) => {
    n.content = parsed.observaciones || n.content;
    n.interventions = parsed.intervenciones || n.interventions;
    n.plan = parsed.plan || n.plan;
    saveData(); renderTabContent();
  });
}

function parseStructuredResult(text) {
  const sections = { observaciones: '', intervenciones: '', tareas: '', plan: '' };
  const regex = /(OBSERVACIONES|INTERVENCIONES|TAREAS[^:]*|PLAN[^:]*):\s*([\s\S]*?)(?=\n(?:OBSERVACIONES|INTERVENCIONES|TAREAS|PLAN):|$)/gi;
  let m;
  while ((m = regex.exec(text)) !== null) {
    const key = m[1].toUpperCase();
    const content = m[2].trim();
    if (key.startsWith('OBSERV')) sections.observaciones = content;
    else if (key.startsWith('INTERV')) sections.intervenciones = content;
    else if (key.startsWith('TAREAS')) sections.tareas = content;
    else if (key.startsWith('PLAN')) sections.plan = content;
  }
  return sections;
}

// ==================== .ICS EXPORT (Google/Apple Calendar) ====================
function buildICSEvent(session, patientName) {
  const date = session.date; const time = session.time || '00:00';
  const start = new Date(date + 'T' + time + ':00');
  const end = new Date(start.getTime() + (session.duration||50)*60000);
  const fmt = (d) => d.toISOString().replace(/[-:]/g,'').split('.')[0] + 'Z';
  const uid = session.id + '@psioffice';
  return [
    'BEGIN:VEVENT',
    'UID:' + uid,
    'DTSTAMP:' + fmt(new Date()),
    'DTSTART:' + fmt(start),
    'DTEND:' + fmt(end),
    'SUMMARY:Sesión con ' + patientName,
    'DESCRIPTION:PsiOffice - ' + (session.notes || '').replace(/\n/g,'\\n').slice(0,200),
    'BEGIN:VALARM',
    'TRIGGER:-PT15M',
    'ACTION:DISPLAY',
    'DESCRIPTION:Próxima sesión en 15 min',
    'END:VALARM',
    'END:VEVENT'
  ].join('\r\n');
}

function wrapICS(events) {
  return 'BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//PsiOffice//ES\r\nCALSCALE:GREGORIAN\r\n' + events.join('\r\n') + '\r\nEND:VCALENDAR';
}

function downloadSessionICS(pid, sid) {
  const p = getPatient(pid); const s = p.sessions.find(x=>x.id===sid);
  if (!s) return;
  const ics = wrapICS([buildICSEvent(s, p.personal.name)]);
  const blob = new Blob([ics], { type: 'text/calendar' });
  saveAs(blob, `sesion_${sanitize(p.personal.name)}_${s.date}.ics`);
  toast('✓ Abrilo con Google/Apple Calendar');
}

function exportMonthICS() {
  const year = calendarMonth.getFullYear(); const month = calendarMonth.getMonth();
  const events = [];
  for (const p of data.patients) for (const s of p.sessions) {
    if (!s.date) continue;
    const d = new Date(s.date);
    if (d.getFullYear() === year && d.getMonth() === month) events.push(buildICSEvent(s, p.personal.name));
  }
  if (events.length === 0) { toast('No hay sesiones este mes para exportar'); return; }
  const ics = wrapICS(events);
  const blob = new Blob([ics], { type: 'text/calendar' });
  saveAs(blob, `agenda_psioffice_${year}_${String(month+1).padStart(2,'0')}.ics`);
  toast('✓ Abrilo con Google/Apple Calendar');
}

// ==================== BROWSER NOTIFICATIONS ====================
let reminderInterval = null;
let notifiedSessions = new Set();

function requestNotifPermission() {
  if (!('Notification' in window)) return toast('Tu navegador no soporta notificaciones');
  Notification.requestPermission().then(perm => {
    if (perm === 'granted') toast('✓ Notificaciones activadas');
    else toast('No concediste permiso');
  });
}

function startReminderCheck() {
  stopReminderCheck();
  reminderInterval = setInterval(checkUpcomingReminders, 60000);
  checkUpcomingReminders();
}
function stopReminderCheck() { if (reminderInterval) { clearInterval(reminderInterval); reminderInterval = null; } }

function checkUpcomingReminders() {
  if (!('Notification' in window) || Notification.permission !== 'granted') return;
  if (!data) return;
  const now = new Date();
  for (const p of data.patients) for (const s of p.sessions) {
    if (!s.date || !s.time || notifiedSessions.has(s.id)) continue;
    const sessTime = new Date(s.date + 'T' + s.time + ':00');
    const diffMin = (sessTime - now) / 60000;
    if (diffMin > 0 && diffMin <= 15) {
      new Notification('Sesión en ' + Math.round(diffMin) + ' minutos', { body: `${p.personal.name} · ${s.time}`, icon: '' });
      notifiedSessions.add(s.id);
    }
  }
}

        const absent = data.patients.filter(p => {
          const lastSession = p.sessions.filter(s=>s.date && new Date(s.date) < now).sort((a,b)=>new Date(b.date)-new Date(a.date))[0];
          const nextSession = p.sessions.filter(s=>s.date && new Date(s.date) >= now)[0];
          if (nextSession) return false;
          if (!lastSession) return false;
          const days = (now - new Date(lastSession.date)) / (1000*60*60*24);
          return days > 21 && days < 180;
        }).map(p => {
          const lastSession = p.sessions.filter(s=>s.date).sort((a,b)=>new Date(b.date)-new Date(a.date))[0];
          const days = Math.round((now - new Date(lastSession.date)) / (1000*60*60*24));
          return {...p, lastDays: days};
        }).sort((a,b)=>b.lastDays-a.lastDays);
        if (absent.length === 0) return '';
        return `<div class="card">
          <h3>🚨 Pacientes ausentes hace tiempo</h3>
          <p style="color: var(--text-light); font-size: 13px; margin-bottom: 10px;">Riesgo de abandono. Considerá mandar un mensaje de reconexión:</p>
          ${absent.slice(0,6).map(p => `<div class="alert-item warning">
            <div><strong>${escapeHtml(p.personal.name)}</strong> · última sesión hace ${p.lastDays} días</div>
            <div style="display: flex; gap: 6px;">
              ${p.personal.phone ? `<button class="btn btn-secondary" onclick="useReconnectTemplate('${p.id}')">💬 Mensaje reconexión</button>` : ''}
              <button class="btn" onclick="selectPatient('${p.id}')">Ver ficha</button>
            </div>
          </div>`).join('')}
        </div>`;
      })()}
      ${data.settings.isInNetwork && pendingCommissions.length > 0 ? `
      <div class="card">
        <h3>🤝 Comisiones por transferir a ${escapeHtml(data.settings.teamLeaderName||'jefa de equipo')}</h3>
        ${pendingCommissions.map(c => `<div class="alert-item danger">
          <div><strong>${escapeHtml(c.patientName)}</strong> — ${money(c.commission.toFixed(2))} (${data.settings.commissionPercent}% de ${money(c.amount)}) · ${formatDate(c.date)}</div>
          <button class="btn btn-success" onclick="markCommissionPaid('${c.patientId}','${c.sessionId}')">✓ Transferida</button>
        </div>`).join('')}
      </div>` : ''}
    </div>
  `;
  const hasChartData = last6.some(m => (m.cobrado||0) > 0 || (m.pendiente||0) > 0);
  if (hasChartData) setTimeout(() => renderMonthsChart(last6), 50);
}

function renderMonthsChart(stats) {
  const ctx = document.getElementById('monthsChart');
  if (!ctx) return;
  if (dashboardChart) dashboardChart.destroy();
  dashboardChart = new Chart(ctx, {
    type: 'bar',
    data: {
      labels: stats.map(s => s.label),
      datasets: [
        { label: 'Cobrado', data: stats.map(s => s.cobrado), backgroundColor: '#25627c', borderRadius: 6 },
        { label: 'Pendiente', data: stats.map(s => s.pendiente), backgroundColor: '#c89b3c', borderRadius: 6 }
      ]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { labels: { font: { family: 'Manrope' } } } },
      scales: { y: { ticks: { font: { family: 'Manrope' } } }, x: { ticks: { font: { family: 'Manrope' } } } }
    }
  });
}

function computeMonthStats(monthKey) {
  const stats = { cobrado: 0, pendiente: 0, sessionsTotal: 0, sessionsDone: 0, sessionsUpcoming: 0, sessionsPending: 0 };
  const now = new Date();
  for (const p of data.patients) {
    for (const s of p.sessions) {
      if (!s.date) continue;
      const d = new Date(s.date);
      const key = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
      if (key !== monthKey) continue;
      stats.sessionsTotal++;
      if (d < now) stats.sessionsDone++; else stats.sessionsUpcoming++;
      if (s.paid) stats.cobrado += s.amount || 0;
      else { stats.pendiente += s.amount || 0; if ((s.amount||0)>0) stats.sessionsPending++; }
    }
  }
  return stats;
}

function getLast6MonthsStats() {
  const now = new Date();
  const stats = [];
  for (let i = 5; i >= 0; i--) {
    const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
    const key = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
    const s = computeMonthStats(key);
    stats.push({ label: d.toLocaleDateString('es-AR', {month:'short'}), ...s });
  }
  return stats;
}

function getUpcomingSessions() {
  const now = new Date(); const week = new Date(now); week.setDate(week.getDate()+7);
  const list = [];
  for (const p of data.patients) {
    for (const s of p.sessions) {
      if (!s.date) continue;
      const d = new Date(s.date + (s.time? 'T'+s.time : 'T23:59'));
      if (d >= now && d <= week) list.push({patientId: p.id, sessionId: s.id, patientName: p.personal.name, date: s.date, time: s.time});
    }
  }
  return list.sort((a,b)=>new Date(a.date+'T'+(a.time||'00:00'))-new Date(b.date+'T'+(b.time||'00:00')));
}

function getPendingPayments() {
  const list = [];
  for (const p of data.patients) for (const s of p.sessions)
    if (!s.paid && (s.amount||0) > 0) list.push({patientId: p.id, sessionId: s.id, patientName: p.personal.name, amount: s.amount, date: s.date});
  return list.sort((a,b)=>new Date(a.date)-new Date(b.date));
}

function getPendingCommissions() {
  if (!data.settings.isInNetwork) return [];
  const pct = parseFloat(data.settings.commissionPercent) / 100;
  const list = [];
  for (const p of data.patients) for (const s of p.sessions)
    if (s.paid && !s.commissionPaid && (s.amount||0) > 0)
      list.push({patientId: p.id, sessionId: s.id, patientName: p.personal.name, amount: s.amount, commission: s.amount * pct, date: s.date});
  return list;
}

function markPaid(pid, sid) {
  const p = getPatient(pid); if (!p) return;
  const s = p.sessions.find(x => x.id === sid); if (!s) return;
  s.paid = true; saveData(); renderMain(); renderSidebar();
}
function markCommissionPaid(pid, sid) {
  const p = getPatient(pid); if (!p) return;
  const s = p.sessions.find(x => x.id === sid); if (!s) return;
  s.commissionPaid = true; saveData(); renderMain();
}

// ==================== CIERRE SEMANAL ====================
function renderCierre(el) {
  const now = new Date();
  const weekStart = new Date(now); weekStart.setDate(now.getDate() - now.getDay() + 1);
  const weekEnd = new Date(weekStart); weekEnd.setDate(weekEnd.getDate() + 6);
  const inWeek = (dateStr) => { if (!dateStr) return false; const d = new Date(dateStr); return d >= weekStart && d <= weekEnd; };

  const weekSessions = [];
  for (const p of data.patients) for (const s of p.sessions) if (inWeek(s.date))
    weekSessions.push({...s, patientName: p.personal.name, patientId: p.id});

  const cobrado = weekSessions.filter(s=>s.paid).reduce((sum,s)=>sum+(s.amount||0),0);
  const pendiente = weekSessions.filter(s=>!s.paid).reduce((sum,s)=>sum+(s.amount||0),0);

  const allPending = getPendingPayments();
  const oldPending = allPending.filter(p => { const d = new Date(p.date); const days = (now - d) / (1000*60*60*24); return days > 7; });

  el.innerHTML = `
    <div class="tab-content">
      <h1 style="color: var(--azul-profundo); font-size: 36px; margin-bottom: 4px; font-weight: 400;">Cierre semanal</h1>
      <p style="color: var(--text-light); margin-bottom: 24px;">Semana del ${formatDate(weekStart.toISOString())} al ${formatDate(weekEnd.toISOString())} · 10 min para dejar todo ordenado</p>

      <div class="grid-3" style="margin-bottom: 20px;">
        <div class="stat-card"><div class="stat-label">Sesiones de la semana</div><div class="stat-value">${weekSessions.length}</div></div>
        <div class="stat-card"><div class="stat-label">Cobrado</div><div class="stat-value" style="color: var(--success);">${money(cobrado)}</div></div>
        <div class="stat-card"><div class="stat-label">Pendiente de la semana</div><div class="stat-value" style="color: var(--warning);">${money(pendiente)}</div></div>
      </div>

      <div class="card">
        <h3>1. Revisá las sesiones de la semana</h3>
        <p style="color: var(--text-light); margin-bottom: 12px; font-size: 13px;">Marcá como pagadas las que ya te pagaron:</p>
        ${weekSessions.length === 0 ? '<p style="color: var(--text-light);">No hubo sesiones esta semana.</p>' :
          weekSessions.map(s => `<div class="alert-item ${s.paid?'success':'warning'}">
            <div><strong>${escapeHtml(s.patientName)}</strong> · ${formatDate(s.date)} ${s.time||''} · ${money(s.amount||0)}</div>
            <label class="checkbox-row"><input type="checkbox" ${s.paid?'checked':''} onchange="updateSessionById('${s.patientId}','${s.id}','paid',this.checked); renderMain();"> ${s.paid?'Pagada ✓':'Marcar pagada'}</label>
          </div>`).join('')}
      </div>

      <div class="card">
        <h3>2. Pagos atrasados (más de 7 días)</h3>
        ${oldPending.length === 0 ? '<p style="color: var(--success);">No hay pagos atrasados. ✓</p>' :
          oldPending.map(p => `<div class="alert-item danger">
            <div><strong>${escapeHtml(p.patientName)}</strong> — ${money(p.amount)} · del ${formatDate(p.date)}</div>
            <div style="display: flex; gap: 6px;">
              ${getPatient(p.patientId).personal.phone ? `<button class="btn btn-secondary" onclick="sendPaymentReminder('${p.patientId}','${p.sessionId}')">💬 Recordar</button>` : ''}
              <button class="btn btn-success" onclick="markPaid('${p.patientId}','${p.sessionId}')">✓</button>
            </div>
          </div>`).join('')}
      </div>

      <div class="card">
        <h3>3. Checklist de cierre</h3>
        <div class="checklist-item"><input type="checkbox" id="cl1"><label for="cl1">Pasé las notas de todas las sesiones de la semana</label></div>
        <div class="checklist-item"><input type="checkbox" id="cl2"><label for="cl2">Marqué los pagos recibidos</label></div>
        <div class="checklist-item"><input type="checkbox" id="cl3"><label for="cl3">Envié los recordatorios para la semana que viene</label></div>
        <div class="checklist-item"><input type="checkbox" id="cl4"><label for="cl4">Revisé las comisiones pendientes (si aplica)</label></div>
        <div class="checklist-item"><input type="checkbox" id="cl5"><label for="cl5">Actualicé mi agenda personal con los turnos confirmados</label></div>
        <div class="checklist-item"><input type="checkbox" id="cl6"><label for="cl6">Dediqué 5 min a reflexionar: ¿qué funcionó esta semana? ¿Qué puedo mejorar?</label></div>

        <div class="field" style="margin-top: 16px;"><label>Notas personales de la semana</label><textarea id="cierreNotes" rows="3" placeholder="Qué funcionó, qué no, decisiones para la semana que viene..."></textarea></div>
        <button class="btn btn-primary" onclick="saveCierre()">✓ Guardar cierre</button>
      </div>

      ${data.cierreHistory.length > 0 ? `
        <div class="card">
          <h3>Cierres anteriores</h3>
          ${data.cierreHistory.slice(-5).reverse().map(c => `<details><summary>${formatDate(c.date)} — ${money(c.cobrado)} cobrado · ${c.sessions} sesiones</summary><div style="margin-top: 8px; font-size: 13px; color: var(--text-light);">${escapeHtml(c.notes||'(sin notas)')}</div></details>`).join('')}

function saveCierre() {
  const now = new Date();
  const weekStart = new Date(now); weekStart.setDate(now.getDate() - now.getDay() + 1);
  const weekEnd = new Date(weekStart); weekEnd.setDate(weekEnd.getDate() + 6);
  const inWeek = (dateStr) => { if (!dateStr) return false; const d = new Date(dateStr); return d >= weekStart && d <= weekEnd; };
  let cobrado = 0, sessions = 0;
  for (const p of data.patients) for (const s of p.sessions) if (inWeek(s.date)) { sessions++; if (s.paid) cobrado += s.amount||0; }
  data.cierreHistory.push({ date: now.toISOString(), cobrado, sessions, notes: document.getElementById('cierreNotes').value });
  saveData(); toast('✓ Cierre guardado'); renderMain();
}

function updateSessionById(pid, sid, field, value) {
  const p = getPatient(pid); const s = p.sessions.find(x=>x.id===sid);
  if (!s) return;
  s[field] = value; saveData();
}

// ==================== HONORARIOS CALCULATOR ====================
function renderHonorarios(el) {
  const s = data.settings;
  if (!s.honorarios) s.honorarios = { gastosFijos: 0, horasSemana: 20, semanasAnio: 48, margenDeseado: 30, duracionSesion: 50 };
  const h = s.honorarios;
  const horasAnio = h.horasSemana * h.semanasAnio;
  const sesionesAnio = horasAnio * (60 / h.duracionSesion);
  const costoPorSesion = sesionesAnio > 0 ? h.gastosFijos * 12 / sesionesAnio : 0;
  const tarifaMinima = costoPorSesion * (1 + h.margenDeseado/100);
  const simulAumento = s.honorarios.simulAumento || 15;
  const tarifaConAumento = tarifaMinima * (1 + simulAumento/100);
  const ingresoMensual = tarifaMinima * (sesionesAnio / 12);
  const ingresoConAumento = tarifaConAumento * (sesionesAnio / 12);

  el.innerHTML = `
    <div class="tab-content">
      <h1 style="color: var(--azul-profundo); font-size: 36px; margin-bottom: 4px; font-weight: 400;">Calculadora de honorarios</h1>
      <p style="color: var(--text-light); margin-bottom: 24px;">¿Cuánto tenés que cobrar por sesión para cubrir tus gastos y ganar lo que querés?</p>

          <div class="grid-2">
            <div class="field"><label>Horas por semana que querés trabajar</label><input type="number" value="${h.horasSemana}" onchange="updateHonorarios('horasSemana', parseFloat(this.value)||0)"></div>
            <div class="field"><label>Semanas por año</label><input type="number" value="${h.semanasAnio}" onchange="updateHonorarios('semanasAnio', parseFloat(this.value)||0)"><div style="font-size: 11px; color: var(--text-light); margin-top: 4px;">Descontá vacaciones</div></div>
          </div>
          <div class="grid-2">
            <div class="field"><label>Duración sesión (min)</label><input type="number" value="${h.duracionSesion}" onchange="updateHonorarios('duracionSesion', parseFloat(this.value)||0)"></div>
            <div class="field"><label>Margen de ganancia deseado (%)</label><input type="number" value="${h.margenDeseado}" onchange="updateHonorarios('margenDeseado', parseFloat(this.value)||0)"></div>
          </div>
        </div>

        <div class="card" style="background: var(--azul-profundo); color: var(--arena); border-color: var(--azul-profundo);">
          <h3 style="color: var(--arena);">Resultado</h3>
          <div style="margin-bottom: 20px;">
            <div style="font-size: 12px; opacity: 0.7; text-transform: uppercase; letter-spacing: 0.1em;">Tarifa mínima por sesión</div>
            <div style="font-family: var(--font-serif); font-size: 48px; font-weight: 500; margin: 8px 0;">${money(Math.round(tarifaMinima))}</div>
            <div style="font-size: 12px; opacity: 0.7;">Para cubrir gastos + ${h.margenDeseado}% de margen</div>
          </div>
          <div class="divider" style="background: rgba(238,232,220,0.2);"></div>
          <div style="font-size: 13px; line-height: 1.8;">
            <div>Costo real por sesión: <strong>${money(Math.round(costoPorSesion))}</strong></div>
            <div>Sesiones por año: <strong>${Math.round(sesionesAnio)}</strong></div>
            <div>Ingreso mensual estimado: <strong>${money(Math.round(ingresoMensual))}</strong></div>
          </div>

      </div>

      <div class="card">
        <h3>Simulador de aumento</h3>

          <div class="alert-item success"><div><strong>Nuevo ingreso mensual:</strong> ${money(Math.round(ingresoConAumento))} <span style="color: var(--text-light); font-size: 12px;">(+${money(Math.round(ingresoConAumento-ingresoMensual))})</span></div></div>

function updateHonorarios(field, value) { if (!data.settings.honorarios) data.settings.honorarios = {}; data.settings.honorarios[field] = value; saveData(); renderMain(); }

// ==================== OBRAS SOCIALES ====================
function renderObras(el) {
  const insurers = data.insurers;
  // compute totals per insurer
  const totals = {};
  for (const p of data.patients) {
    if (!p.insurance?.provider) continue;
    const prov = p.insurance.provider;
    if (!totals[prov]) totals[prov] = { presentado: 0, cobrado: 0, rechazado: 0, demoraAvg: [], claims: 0 };
    for (const c of p.insuranceClaims || []) {
      totals[prov].claims++;
      totals[prov].presentado += c.amount || 0;
      if (c.status === 'paid') {
        totals[prov].cobrado += c.amountPaid || c.amount || 0;
        if (c.presentedDate && c.paidDate) {
          const days = (new Date(c.paidDate) - new Date(c.presentedDate)) / (1000*60*60*24);
          totals[prov].demoraAvg.push(days);
        }
      } else if (c.status === 'rejected') totals[prov].rechazado += c.amount || 0;
    }
  }

  el.innerHTML = `
    <div class="tab-content">
      <h1 style="color: var(--azul-profundo); font-size: 36px; margin-bottom: 4px; font-weight: 400;">Obras sociales y prepagas</h1>
      <p style="color: var(--text-light); margin-bottom: 24px;">Qué presentaste, qué te pagaron, qué rechazaron, cuántos días demoran.</p>

      <div class="card">
        <h3>Catálogo de obras sociales</h3>
        <p style="color: var(--text-light); font-size: 13px; margin-bottom: 12px;">Cargá las obras sociales / prepagas con las que trabajás. Después las asignás a cada paciente.</p>
        ${insurers.length === 0 ? '<p style="color: var(--text-muted); padding: 10px;">Aún no cargaste ninguna.</p>' : insurers.map(i => `
          <div class="alert-item info">
            <div>
              <strong>${escapeHtml(i.name)}</strong>
              <div style="font-size: 12px; color: var(--text-light);">Pagan ${money(i.feeOS||0)} por sesión · Copago del paciente: ${money(i.copay||0)}</div>
            </div>
            <button class="btn btn-danger" onclick="deleteInsurer('${i.id}')">🗑</button>
          </div>
        `).join('')}
        <button class="btn btn-primary" onclick="addInsurerModal()">+ Agregar obra social</button>
      </div>

      ${Object.keys(totals).length > 0 ? `
      <div class="card">
        <h3>Resumen por obra social</h3>
        <div class="commission-row header">
          <div>Obra social</div><div>Presentado</div><div>Cobrado</div><div>Demora promedio</div><div>Rechazado</div>
        </div>
        ${Object.entries(totals).map(([name, t]) => `
          <div class="commission-row">
            <div><strong>${escapeHtml(name)}</strong><div style="font-size: 11px; color: var(--text-light);">${t.claims} presentaciones</div></div>
            <div>${money(t.presentado)}</div>
            <div style="color: var(--success);">${money(t.cobrado)}</div>
            <div>${t.demoraAvg.length>0 ? Math.round(t.demoraAvg.reduce((a,b)=>a+b,0)/t.demoraAvg.length) + ' días' : '—'}</div>
            <div style="color: var(--danger);">${money(t.rechazado)}</div>
          </div>
        `).join('')}
      </div>` : ''}

      <div class="card">
        <h3>Todas las presentaciones</h3>
        ${renderAllClaims()}
      </div>
    </div>
  `;
}

function renderAllClaims() {
  const claims = [];
  for (const p of data.patients) for (const c of p.insuranceClaims || [])
    claims.push({...c, patientName: p.personal.name, patientId: p.id, insurer: p.insurance?.provider || '—'});
  if (claims.length === 0) return '<p style="color: var(--text-light);">No hay presentaciones cargadas. Cargá reclamos desde la ficha de cada paciente → pestaña "Obra social".</p>';
  return claims.sort((a,b)=>new Date(b.presentedDate||0)-new Date(a.presentedDate||0)).map(c => {
    const statusLabel = { pending: 'Pendiente', paid: 'Cobrada', rejected: 'Rechazada' };
    const statusClass = { pending: 'warning', paid: 'success', rejected: 'danger' };
    return `<div class="alert-item ${statusClass[c.status]||'info'}">
      <div><strong>${escapeHtml(c.patientName)}</strong> · ${escapeHtml(c.insurer)} · Período ${c.period||'—'}<div style="font-size: 12px; color: var(--text-light);">Presentado ${formatDate(c.presentedDate)} · ${money(c.amount)} · ${c.sessions||'?'} sesiones</div></div>
      <span class="pill">${statusLabel[c.status]||c.status}</span>
    </div>`;
  }).join('');
}

function saveInsurer() {

  data.insurers.push({ id: uuid(), name, feeOS: parseFloat(document.getElementById('ins_fee').value)||0, copay: parseFloat(document.getElementById('ins_copay').value)||0 });
  saveData(); closeModal(); renderMain();
}
function deleteInsurer(id) {
  if (!confirm('¿Eliminar esta obra social del catálogo?')) return;
  data.insurers = data.insurers.filter(i=>i.id!==id); saveData(); renderMain();
}

// ==================== TEAM VIEW ====================
function renderTeam(el) {
  const s = data.settings;
  const pendingCommissions = getPendingCommissions();
  const paidCommissions = [];
  for (const p of data.patients) for (const sess of p.sessions)
    if (sess.paid && sess.commissionPaid && (sess.amount||0) > 0)
      paidCommissions.push({patientName: p.personal.name, date: sess.date, amount: sess.amount, commission: sess.amount * (s.commissionPercent/100)});
  const totalOwed = pendingCommissions.reduce((sum,c)=>sum+c.commission, 0);
  const totalPaid = paidCommissions.reduce((sum,c)=>sum+c.commission, 0);

  el.innerHTML = `
    <div class="tab-content">
      <h1 style="color: var(--azul-profundo); font-size: 36px; margin-bottom: 4px; font-weight: 400;">Equipo y comisiones</h1>
      <p style="color: var(--text-light); margin-bottom: 24px;">Para cuando trabajás en red y tenés que transferir un porcentaje.</p>

      <div class="card">
        <h3>Configuración</h3>
        <div class="checkbox-row" style="margin-bottom: 14px;">
          <input type="checkbox" id="isInNetwork" ${s.isInNetwork?'checked':''} onchange="data.settings.isInNetwork=this.checked;saveData();renderTeam(document.getElementById('mainContent'));">
          <label for="isInNetwork" style="margin: 0; text-transform: none; letter-spacing: normal; font-size: 14px; color: var(--text);">Trabajo en red / equipo</label>
        </div>
        ${s.isInNetwork ? `
          <div class="grid-2">
            <div class="field"><label>Nombre de la jefa/jefe de equipo</label><input value="${escapeHtml(s.teamLeaderName)}" onchange="data.settings.teamLeaderName=this.value;saveData();"></div>
            <div class="field"><label>Porcentaje de comisión (%)</label><input type="number" value="${s.commissionPercent}" onchange="data.settings.commissionPercent=parseFloat(this.value)||0;saveData();renderTeam(document.getElementById('mainContent'));"></div>
          </div>
        ` : ''}
      </div>

      ${s.isInNetwork ? `
      <div class="grid-2" style="margin-bottom: 20px;">
        <div class="stat-card"><div class="stat-value" style="color: var(--danger);">${money(totalOwed.toFixed(0))}</div><div class="stat-label">Por transferir</div></div>
        <div class="stat-card"><div class="stat-value" style="color: var(--success);">${money(totalPaid.toFixed(0))}</div><div class="stat-label">Ya transferido</div></div>
      </div>

      <div class="card">
        <h3>Pendientes de transferir a ${escapeHtml(s.teamLeaderName||'la jefa')}</h3>
        ${pendingCommissions.length === 0 ? '<p style="color: var(--text-light);">No hay comisiones pendientes.</p>' : `
          <div class="commission-row header"><div>Paciente</div><div>Fecha</div><div>Sesión</div><div>Comisión</div><div></div></div>
          ${pendingCommissions.map(c => `<div class="commission-row">
            <div>${escapeHtml(c.patientName)}</div><div>${formatDate(c.date)}</div><div>${money(c.amount)}</div>
            <div><strong>${money(c.commission.toFixed(0))}</strong></div>
            <button class="btn btn-success" onclick="markCommissionPaid('${c.patientId}','${c.sessionId}')">✓</button>
          </div>`).join('')}
        `}
      </div>` : '<div class="card"><p style="color: var(--text-light); padding: 10px;">Activá "Trabajo en red" arriba si sos parte de una red.</p></div>'}
    </div>
  `;
}

      <button class="tab ${currentTab==='consent'?'active':''}" onclick="selectTab('consent')">Consentimiento</button>
      <button class="tab ${currentTab==='sessions'?'active':''}" onclick="selectTab('sessions')">Sesiones</button>

      <button class="tab ${currentTab==='evaluations'?'active':''}" onclick="selectTab('evaluations')">Evaluaciones</button>
      <button class="tab ${currentTab==='genogram'?'active':''}" onclick="selectTab('genogram')">Genograma</button>
      <button class="tab ${currentTab==='payments'?'active':''}" onclick="selectTab('payments')">Pagos</button>

    </div>
    <div id="tabContent" class="tab-content"></div>
  `;
  renderTabContent();

function selectTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  if (event?.target) event.target.classList.add('active');
  renderTabContent();
}

function renderTabContent() {
  const p = getPatient(currentPatientId);
  const el = document.getElementById('tabContent');
  if (!el || !p) return;
  if (currentTab === 'personal') renderPersonal(el, p);
  else if (currentTab === 'anamnesis') renderAnamnesis(el, p);
  else if (currentTab === 'consent') renderConsent(el, p);
  else if (currentTab === 'sessions') renderSessions(el, p);
  else if (currentTab === 'evolution') renderEvolution(el, p);
  else if (currentTab === 'goals') renderGoals(el, p);
  else if (currentTab === 'network') renderNetwork(el, p);
  else if (currentTab === 'evaluations') renderEvaluations(el, p);
  else if (currentTab === 'genogram') renderGenogram(el, p);
  else if (currentTab === 'payments') renderPayments(el, p);
  else if (currentTab === 'receipts') renderReceipts(el, p);
  else if (currentTab === 'insurance') renderInsurance(el, p);
}

function updateField(path, value) {
  const p = getPatient(currentPatientId);
  const parts = path.split('.'); let obj = p;
  for (let i=0;i<parts.length-1;i++) obj=obj[parts[i]];
  obj[parts[parts.length-1]] = value; saveData();
}

function generateConsentPDF() {
  const p = getPatient(currentPatientId);
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  doc.setFont('helvetica','bold'); doc.setFontSize(16); doc.text('CONSENTIMIENTO INFORMADO', 105, 20, {align:'center'});
  doc.setFont('helvetica','normal'); doc.setFontSize(11);
  let y = 35;
  const line = (text, bold=false) => { doc.setFont('helvetica', bold?'bold':'normal'); const split = doc.splitTextToSize(text, 170); doc.text(split, 20, y); y += split.length * 6; };
  line(`Fecha: ${formatDate(new Date().toISOString())}`);
  line(`Paciente: ${p.personal.name || '____________________'}`);
  line(`DNI: ${p.personal.document || '____________________'}`);
  line(`Profesional: ${data.settings.therapistName || '____________________'}${data.settings.license ? ' — Mat. '+data.settings.license : ''}`);
  y += 6;
  line('1. ALCANCE DEL TRATAMIENTO', true);
  line('El tratamiento psicológico consiste en un proceso de acompañamiento clínico que se desarrolla mediante encuentros periódicos. Su objetivo es trabajar sobre el malestar, los síntomas y/o los motivos de consulta planteados.');
  y += 4;
  line('2. CONFIDENCIALIDAD', true);
  line('Toda la información compartida en el espacio terapéutico está protegida por el secreto profesional (art. 156 del Código Penal), con excepción de los casos previstos por la ley: riesgo de vida propio o de terceros, situaciones de abuso a menores, o requerimiento judicial fundado.');
  y += 4;
  line('3. HISTORIA CLÍNICA (Ley 26.529)', true);
  line('Se llevará un registro escrito de los encuentros, con fecha, evolución y observaciones clínicas, resguardado bajo normas de confidencialidad. El paciente puede solicitar copia de su historia clínica en cualquier momento.');
  y += 4;
  line('4. HONORARIOS Y CANCELACIONES', true);
  line('Los honorarios y la modalidad de pago fueron acordados verbalmente al inicio del tratamiento. Las cancelaciones avisadas con menos de 24hs pueden ser facturadas en su totalidad.');
  y += 10;
  line('Firma del paciente: _____________________________');
  y += 10;
  line('Firma del profesional: __________________________');
  doc.save(`consentimiento_${sanitize(p.personal.name)}.pdf`);
  toast('✓ PDF descargado');
}

function addSession() {
  const p = getPatient(currentPatientId);
  p.sessions.push({ id: uuid(), date: new Date().toISOString().split('T')[0], time: '', duration: 50, notes: '', interventions: '', homework: '', amount: p.fee.amount || 0, paid: false, commissionPaid: false });
  saveData(); renderTabContent();
}
function updateSession(id, field, value) {
  const p = getPatient(currentPatientId);
  const s = p.sessions.find(x => x.id === id); if (!s) return;

function addEvolutionNote() {

}
function updateEvolutionNote(id, field, value) {
  const p = getPatient(currentPatientId);
  const n = p.evolutionNotes.find(x => x.id === id); if (!n) return;
  n[field] = value; saveData();
}
function deleteEvolutionNote(id) {
  if (!confirm('¿Eliminar esta nota?')) return;
  const p = getPatient(currentPatientId);
  p.evolutionNotes = p.evolutionNotes.filter(n => n.id !== id);
  saveData(); renderTabContent();
}

function generateEvolutionPDF() {
  const p = getPatient(currentPatientId);
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  doc.setFont('helvetica','bold'); doc.setFontSize(16); doc.text('NOTAS DE EVOLUCIÓN', 105, 20, {align:'center'});
  doc.setFontSize(10); doc.setFont('helvetica','normal');
  doc.text(`Paciente: ${p.personal.name}`, 20, 30);
  doc.text(`DNI: ${p.personal.document||'—'}`, 20, 36);
  doc.text(`Profesional: ${data.settings.therapistName||'—'}${data.settings.license?' · Mat. '+data.settings.license:''}`, 20, 42);
  doc.text(`Historia clínica — Ley 26.529`, 20, 48);
  let y = 60;
  p.evolutionNotes.forEach((n, i) => {
    if (y > 260) { doc.addPage(); y = 20; }
    doc.setFont('helvetica','bold'); doc.setFontSize(11);
    doc.text(`Nota N° ${i+1} — ${formatDate(n.date)} (${n.modality||''})`, 20, y); y += 7;
    doc.setFont('helvetica','normal'); doc.setFontSize(10);
    const block = (title, text) => {
      if (!text) return;
      if (y > 275) { doc.addPage(); y = 20; }
      doc.setFont('helvetica','bold'); doc.text(title+':', 20, y); y += 5;
      doc.setFont('helvetica','normal'); const lines = doc.splitTextToSize(text, 170);
      doc.text(lines, 20, y); y += lines.length * 5 + 3;
    };
    block('Motivo', n.motive); block('Contenido', n.content); block('Intervenciones', n.interventions); block('Plan', n.plan);
    y += 4; doc.setDrawColor(200); doc.line(20, y, 190, y); y += 6;
  });

}

// ==================== TAB: PAYMENTS ====================
function renderPayments(el, p) {
  const paid = p.sessions.filter(s => s.paid);
  const pending = p.sessions.filter(s => !s.paid);
  const totalPaid = paid.reduce((s,x)=>s+(x.amount||0),0);
  const totalPending = pending.reduce((s,x)=>s+(x.amount||0),0);
  const byMonth = {};
  for (const s of p.sessions) {
    if (!s.date) continue;
    const d = new Date(s.date);
    const key = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
    if (!byMonth[key]) byMonth[key] = [];
    byMonth[key].push(s);
  }
  const monthKeys = Object.keys(byMonth).sort().reverse();

  el.innerHTML = `
    <div class="card" style="background: var(--arena-light); border-left: 4px solid var(--azul-medio);">
      <h4 style="color: var(--azul-profundo);">💡 Cómo funciona</h4>
      <p style="font-size: 13.5px; line-height: 1.6;">Cada <strong>sesión</strong> es un cobro. Las ves agrupadas por mes abajo y marcás cuáles te pagaron. Si te pagaron varias juntas, usá "Marcar mes como pagado".</p>
      <div style="margin-top: 10px;">
        <button class="btn btn-primary" onclick="selectTab('sessions')">+ Ir a Sesiones</button>
        <button class="btn" onclick="quickAddPayment()">💵 Pago suelto (sin sesión)</button>
      </div>
    </div>

    <div class="grid-3" style="margin-bottom: 20px;">
      <div class="stat-card"><div class="stat-value" style="color: var(--success);">${money(totalPaid)}</div><div class="stat-label">Total cobrado</div></div>
      <div class="stat-card"><div class="stat-value" style="color: var(--warning);">${money(totalPending)}</div><div class="stat-label">Total pendiente</div></div>
      <div class="stat-card"><div class="stat-value">${p.sessions.length}</div><div class="stat-label">Sesiones totales</div></div>
    </div>

    ${monthKeys.length === 0 ? '<div class="card" style="text-align: center; padding: 40px;"><p style="color: var(--text-light);">Cargá una sesión primero.</p></div>' : monthKeys.map(mk => {
      const sess = byMonth[mk].sort((a,b) => a.date > b.date ? -1 : 1);
      const mPaid = sess.filter(s=>s.paid).reduce((sum,s)=>sum+(s.amount||0),0);
      const mPending = sess.filter(s=>!s.paid).reduce((sum,s)=>sum+(s.amount||0),0);
      const allPaid = sess.every(s=>s.paid);
      const [y,m] = mk.split('-');
      const monthName = new Date(y, parseInt(m)-1, 1).toLocaleDateString('es-AR', {month: 'long', year: 'numeric'});
      return `<div class="card">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
          <div><h3 style="text-transform: capitalize; margin: 0;">${monthName}</h3>
            <div style="color: var(--text-light); font-size: 13px; margin-top: 4px;">${sess.length} sesiones · Cobrado: <strong style="color: var(--success);">${money(mPaid)}</strong> · Pendiente: <strong style="color: var(--warning);">${money(mPending)}</strong></div>
          </div>
          ${!allPaid ? `<button class="btn btn-success" onclick="markMonthPaid('${mk}')">✓ Marcar mes pagado</button>` : '<span style="color: var(--success); font-weight: 600;">✓ Todo pagado</span>'}
        </div>
        ${sess.map(s => `<div class="alert-item ${s.paid?'success':'warning'}" style="margin-bottom: 6px;">
          <div>
            <strong>${formatDate(s.date)}</strong> ${s.time?'· '+s.time:''} · ${money(s.amount||0)}
            ${s.notes ? `<div style="font-size: 12px; color: var(--text-light); margin-top: 4px;">${escapeHtml(s.notes.slice(0,80))}${s.notes.length>80?'...':''}</div>` : ''}
          </div>
          <div class="row">
            ${s.paid ? `<button class="btn" onclick="generateReceipt('${s.id}')">📄 Recibo</button>` : ''}
            <label class="checkbox-row"><input type="checkbox" ${s.paid?'checked':''} onchange="updateSession('${s.id}','paid',this.checked); renderTabContent(); renderSidebar();"> <span>${s.paid?'Pagada':'Marcar pagada'}</span></label>
          </div>
        </div>`).join('')}
      </div>`;
    }).join('')}
  `;
}

function markMonthPaid(monthKey) {
  const p = getPatient(currentPatientId);
  for (const s of p.sessions) {
    if (!s.date) continue;
    const d = new Date(s.date);
    const key = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
    if (key === monthKey) s.paid = true;
  }
  saveData(); renderTabContent(); renderSidebar();
  toast('✓ Mes marcado como pagado');
}

function generateReceipt(sessionId) {
  const p = getPatient(currentPatientId);

  const doc = new jsPDF();

  // Header
  doc.setFillColor(45, 62, 80); doc.rect(0, 0, 210, 30, 'F');
  doc.setTextColor(238, 232, 220); doc.setFont('helvetica','bold'); doc.setFontSize(20);

  doc.setFontSize(10); doc.setFont('helvetica','normal');
  doc.text(`N° ${num}`, 190, 20, {align:'right'});
  // Body
  doc.setTextColor(0,0,0); let y = 45;
  doc.setFont('helvetica','bold'); doc.setFontSize(11);
  doc.text(data.settings.therapistName || 'Psicólogo/a', 20, y);
  doc.setFont('helvetica','normal'); doc.setFontSize(9);
  if (data.settings.license) doc.text(`Mat. ${data.settings.license}`, 20, y+5);
  if (data.settings.taxId) doc.text(`CUIT: ${data.settings.taxId}`, 20, y+10);
  if (data.settings.address) doc.text(data.settings.address, 20, y+15);
  y = 80;
  doc.setDrawColor(200); doc.line(20, y, 190, y); y += 10;
  doc.setFont('helvetica','bold'); doc.setFontSize(11); doc.text('Recibí de:', 20, y);
  doc.setFont('helvetica','normal'); doc.text(p.personal.name, 50, y); y += 7;
  if (p.personal.document) { doc.setFont('helvetica','bold'); doc.text('DNI:', 20, y); doc.setFont('helvetica','normal'); doc.text(p.personal.document, 50, y); y += 7; }
  doc.setFont('helvetica','bold'); doc.text('Fecha:', 20, y); doc.setFont('helvetica','normal'); doc.text(formatDate(s.date), 50, y); y += 7;
  doc.setFont('helvetica','bold'); doc.text('Concepto:', 20, y); doc.setFont('helvetica','normal'); doc.text(`Sesión de psicoterapia del ${formatDate(s.date)}`, 50, y); y += 14;
  // Amount box
  doc.setFillColor(238, 232, 220); doc.rect(20, y, 170, 20, 'F');
  doc.setFont('helvetica','bold'); doc.setFontSize(16); doc.setTextColor(45, 62, 80);
  doc.text(`La suma de: ${money(s.amount)}`, 105, y+13, {align:'center'});
  y += 40;
  doc.setTextColor(0,0,0); doc.setFontSize(10);
  doc.text(`En ______________________, a los ${new Date().getDate()} días del mes de ${new Date().toLocaleDateString('es-AR',{month:'long'})} de ${new Date().getFullYear()}.`, 20, y);

  doc.line(110, y, 180, y);
  doc.setFontSize(9); doc.text('Firma y aclaración', 145, y+5, {align:'center'});
  doc.save(`recibo_${sanitize(p.personal.name)}_${s.date}.pdf`);
  toast('✓ Recibo descargado');
}
