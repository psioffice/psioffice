function addClaim() { const p = getPatient(currentPatientId); p.insuranceClaims.push({ id: uuid(), period: '', presentedDate: new Date().toISOString().split('T')[0], sessions: 0, amount: 0, status: 'pending', paidDate: '', amountPaid: 0, rejectionReason: '' }); saveData(); renderTabContent(); }
function updateClaim(id, field, value) { const p = getPatient(currentPatientId); const c = p.insuranceClaims.find(x=>x.id===id); if (!c) return; c[field] = value; saveData(); }
function deleteClaim(id) { if (!confirm('¿Eliminar presentación?')) return; const p = getPatient(currentPatientId); p.insuranceClaims = p.insuranceClaims.filter(c=>c.id!==id); saveData(); renderTabContent(); }

// ==================== TAB: GENOGRAM ====================
let genogramState = { selectedNodeId: null, draggingNode: null, dragOffset: null, mode: 'select', connectFrom: null, connectType: 'partner' };

function renderGenogram(el, p) {
  el.innerHTML = `
    <div class="card">
      <h3>Genograma familiar</h3>
      <div class="genogram-hint">
        <strong>Cómo usar:</strong> Elegí un símbolo y hacé clic en el lienzo. Arrastrá para mover. Doble clic para editar. Para conectar, activá "Conectar", clic en una persona y luego en otra.
      </div>
      <div class="genogram-toolbar">
        <button class="btn ${genogramState.mode==='select'?'btn-primary':''}" onclick="setGenogramMode('select')">🖱 Mover</button>
        <button class="btn ${genogramState.mode==='add-male'?'btn-primary':''}" onclick="setGenogramMode('add-male')">▢ Hombre</button>
        <button class="btn ${genogramState.mode==='add-female'?'btn-primary':''}" onclick="setGenogramMode('add-female')">◯ Mujer</button>
        <button class="btn ${genogramState.mode==='add-other'?'btn-primary':''}" onclick="setGenogramMode('add-other')">◇ Otro</button>
        <select id="connectType" style="width: auto;" onchange="genogramState.connectType=this.value">
          <option value="partner">Pareja</option><option value="married">Casados</option><option value="separated">Separados</option><option value="divorced">Divorciados</option><option value="child">Hijo/a de</option><option value="close">Cercanía</option><option value="conflict">Conflicto</option><option value="distant">Distante</option><option value="cutoff">Cortada</option>
        </select>
        <button class="btn ${genogramState.mode==='connect'?'btn-primary':''}" onclick="setGenogramMode('connect')">🔗 Conectar</button>
        <button class="btn btn-danger" onclick="deleteSelectedNode()">🗑 Borrar</button>
        <button class="btn" onclick="clearGenogram()">✖ Limpiar todo</button>
        <button class="btn" onclick="exportGenogramImage()">📷 PNG</button>
      </div>
      <svg id="genogramCanvas" xmlns="http://www.w3.org/2000/svg"></svg>
    </div>
  `;
  drawGenogram(); setupGenogramEvents();
}

function setGenogramMode(mode) { genogramState.mode = mode; genogramState.connectFrom = null; renderTabContent(); }

function drawGenogram() {
  const p = getPatient(currentPatientId);
  const svg = document.getElementById('genogramCanvas');
  if (!svg) return;
  svg.setAttribute('viewBox', '0 0 1000 600');
  svg.innerHTML = '';
  for (const edge of p.genogram.edges) {
    const from = p.genogram.nodes.find(n => n.id === edge.from);
    const to = p.genogram.nodes.find(n => n.id === edge.to);
    if (from && to) drawEdge(svg, from, to, edge);
  }
  for (const node of p.genogram.nodes) drawNode(svg, node);
}

function drawNode(svg, node) {
  const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
  g.setAttribute('class', 'genogram-node'); g.setAttribute('data-id', node.id);
  g.setAttribute('transform', `translate(${node.x},${node.y})`);
  const selected = genogramState.selectedNodeId === node.id;
  const connectFrom = genogramState.connectFrom === node.id;
  const strokeColor = connectFrom ? '#4a7c59' : (selected ? '#c89b3c' : '#2d3e50');
  const strokeW = (selected || connectFrom) ? 3 : 2;
  let shape;
  if (node.gender === 'M') { shape = document.createElementNS('http://www.w3.org/2000/svg','rect'); shape.setAttribute('x',-24); shape.setAttribute('y',-24); shape.setAttribute('width',48); shape.setAttribute('height',48); shape.setAttribute('fill','#c4d6e0'); }
  else if (node.gender === 'F') { shape = document.createElementNS('http://www.w3.org/2000/svg','circle'); shape.setAttribute('cx',0); shape.setAttribute('cy',0); shape.setAttribute('r',26); shape.setAttribute('fill','#dde7ec'); }
  else { shape = document.createElementNS('http://www.w3.org/2000/svg','rect'); shape.setAttribute('x',-24); shape.setAttribute('y',-24); shape.setAttribute('width',48); shape.setAttribute('height',48); shape.setAttribute('fill','#eee8dc'); shape.setAttribute('transform','rotate(45)'); }
  shape.setAttribute('stroke', strokeColor); shape.setAttribute('stroke-width', strokeW); g.appendChild(shape);
  if (node.deceased) {
    const l1 = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    l1.setAttribute('x1',-30); l1.setAttribute('y1',-30); l1.setAttribute('x2',30); l1.setAttribute('y2',30); l1.setAttribute('stroke','#2d3e50'); l1.setAttribute('stroke-width',2); g.appendChild(l1);
    const l2 = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    l2.setAttribute('x1',30); l2.setAttribute('y1',-30); l2.setAttribute('x2',-30); l2.setAttribute('y2',30); l2.setAttribute('stroke','#2d3e50'); l2.setAttribute('stroke-width',2); g.appendChild(l2);
  }
  if (node.isPatient) {
    const inner = document.createElementNS('http://www.w3.org/2000/svg', node.gender==='F'?'circle':'rect');
    if (node.gender==='F') { inner.setAttribute('cx',0); inner.setAttribute('cy',0); inner.setAttribute('r',30); }
    else { inner.setAttribute('x',-30); inner.setAttribute('y',-30); inner.setAttribute('width',60); inner.setAttribute('height',60); if (node.gender!=='M') inner.setAttribute('transform','rotate(45)'); }
    inner.setAttribute('fill','none'); inner.setAttribute('stroke',strokeColor); inner.setAttribute('stroke-width',1.5); g.appendChild(inner);
  }
  if (node.age) {
    const t = document.createElementNS('http://www.w3.org/2000/svg','text');
    t.setAttribute('text-anchor','middle'); t.setAttribute('y',5); t.setAttribute('font-size',14); t.setAttribute('font-weight','bold'); t.setAttribute('fill','#2d3e50'); t.textContent = node.age; g.appendChild(t);
  }
  const nameT = document.createElementNS('http://www.w3.org/2000/svg','text');
  nameT.setAttribute('text-anchor','middle'); nameT.setAttribute('y',48); nameT.setAttribute('font-size',13); nameT.setAttribute('fill','#2d3e50'); nameT.setAttribute('font-weight','500'); nameT.textContent = node.name || '(sin nombre)'; g.appendChild(nameT);
  if (node.role) {
    const r = document.createElementNS('http://www.w3.org/2000/svg','text');
    r.setAttribute('text-anchor','middle'); r.setAttribute('y',64); r.setAttribute('font-size',11); r.setAttribute('fill','#6b7280'); r.textContent = node.role; g.appendChild(r);
  }
  svg.appendChild(g);
}

function drawEdge(svg, from, to, edge) {
  const type = edge.type;
  if (type === 'child') {
    const path = document.createElementNS('http://www.w3.org/2000/svg','path');
    const midY = (from.y + to.y)/2;
    path.setAttribute('d', `M ${from.x},${from.y+30} L ${from.x},${midY} L ${to.x},${midY} L ${to.x},${to.y-30}`);
    path.setAttribute('stroke','#2d3e50'); path.setAttribute('stroke-width',1.5); path.setAttribute('fill','none');
    svg.appendChild(path); return;
  }
  const line = document.createElementNS('http://www.w3.org/2000/svg','line');
  line.setAttribute('x1',from.x); line.setAttribute('y1',from.y); line.setAttribute('x2',to.x); line.setAttribute('y2',to.y);
  let stroke = '#2d3e50', width = 2, dash = '';
  if (type === 'married') width = 3;
  else if (type === 'separated') dash = '6,3';
  else if (type === 'divorced') dash = '10,3';
  else if (type === 'close') { stroke = '#4a7c59'; width = 4; }
  else if (type === 'distant') { stroke = '#6b7280'; dash = '3,4'; }
  else if (type === 'conflict') {
    const path = document.createElementNS('http://www.w3.org/2000/svg','path');
    const dx = to.x - from.x, dy = to.y - from.y, steps = 8;
    let d = `M ${from.x},${from.y}`;
    for (let i = 1; i <= steps; i++) {
      const t = i/steps, x = from.x + dx*t, y = from.y + dy*t;
      const nx = -dy/Math.hypot(dx,dy) * 6 * (i%2===0?1:-1);
      const ny = dx/Math.hypot(dx,dy) * 6 * (i%2===0?1:-1);
      d += ` L ${x+nx},${y+ny}`;
    }
    d += ` L ${to.x},${to.y}`;
    path.setAttribute('d',d); path.setAttribute('stroke','#a84242'); path.setAttribute('stroke-width',2); path.setAttribute('fill','none');
    svg.appendChild(path); return;
  }
  line.setAttribute('stroke',stroke); line.setAttribute('stroke-width',width); if (dash) line.setAttribute('stroke-dasharray',dash);
  svg.appendChild(line);
}

function setupGenogramEvents() {
  const svg = document.getElementById('genogramCanvas');
  if (!svg) return;
  svg.addEventListener('click', (e) => {
    if (genogramState.draggingNode) return;
    const pt = getSVGPoint(svg, e);
    const nodeEl = e.target.closest('.genogram-node');
    const nodeId = nodeEl?.getAttribute('data-id');
    const p = getPatient(currentPatientId);
    if (['add-male','add-female','add-other'].includes(genogramState.mode) && !nodeId) {
      const gender = genogramState.mode === 'add-male' ? 'M' : genogramState.mode === 'add-female' ? 'F' : 'X';
      p.genogram.nodes.push({ id: uuid(), x: pt.x, y: pt.y, gender, name: '', age: '', role: '', notes: '', deceased: false, isPatient: p.genogram.nodes.length === 0 });
      saveData(); genogramState.mode = 'select'; renderTabContent(); return;
    }
    if (genogramState.mode === 'connect' && nodeId) {
      if (!genogramState.connectFrom) { genogramState.connectFrom = nodeId; drawGenogram(); }
      else if (genogramState.connectFrom !== nodeId) {
        p.genogram.edges.push({ id: uuid(), from: genogramState.connectFrom, to: nodeId, type: genogramState.connectType });
        genogramState.connectFrom = null; saveData(); drawGenogram();
      }
      return;
    }
    genogramState.selectedNodeId = nodeId || null; drawGenogram();
  });
  svg.addEventListener('dblclick', (e) => {
    const nodeEl = e.target.closest('.genogram-node');
    if (nodeEl) editNodeModal(nodeEl.getAttribute('data-id'));
  });
  svg.addEventListener('mousedown', (e) => {
    if (genogramState.mode !== 'select') return;
    const nodeEl = e.target.closest('.genogram-node'); if (!nodeEl) return;
    const nodeId = nodeEl.getAttribute('data-id');
    const p = getPatient(currentPatientId);
    const node = p.genogram.nodes.find(n => n.id === nodeId); if (!node) return;
    const pt = getSVGPoint(svg, e);
    genogramState.draggingNode = nodeId; genogramState.dragOffset = { x: pt.x - node.x, y: pt.y - node.y }; genogramState.selectedNodeId = nodeId;
    e.preventDefault();
  });
  svg.addEventListener('mousemove', (e) => {
    if (!genogramState.draggingNode) return;
    const p = getPatient(currentPatientId);
    const node = p.genogram.nodes.find(n => n.id === genogramState.draggingNode); if (!node) return;
    const pt = getSVGPoint(svg, e);
    node.x = pt.x - genogramState.dragOffset.x; node.y = pt.y - genogramState.dragOffset.y;
    drawGenogram();
  });
  window.addEventListener('mouseup', () => { if (genogramState.draggingNode) { genogramState.draggingNode = null; saveData(); } });
}

function getSVGPoint(svg, evt) {
  const rect = svg.getBoundingClientRect(); const vb = svg.viewBox.baseVal;
  return { x: (evt.clientX - rect.left) * (vb.width / rect.width), y: (evt.clientY - rect.top) * (vb.height / rect.height) };
}

function editNodeModal(nodeId) {
  const p = getPatient(currentPatientId);
  const n = p.genogram.nodes.find(x => x.id === nodeId); if (!n) return;
  openModal(`
    <h2>Editar persona</h2>
    <div class="field"><label>Nombre</label><input id="ng_name" value="${escapeHtml(n.name||'')}"></div>
    <div class="grid-2">
      <div class="field"><label>Edad</label><input id="ng_age" value="${escapeHtml(n.age||'')}"></div>
      <div class="field"><label>Género</label>
        <select id="ng_gender"><option value="F" ${n.gender==='F'?'selected':''}>Mujer</option><option value="M" ${n.gender==='M'?'selected':''}>Hombre</option><option value="X" ${n.gender==='X'?'selected':''}>Otro</option></select>
      </div>
    </div>
    <div class="field"><label>Rol / parentesco</label><input id="ng_role" value="${escapeHtml(n.role||'')}" placeholder="madre, padre, hermano..."></div>
    <div class="field"><label>Notas</label><textarea id="ng_notes" rows="3">${escapeHtml(n.notes||'')}</textarea></div>
    <div class="row">
      <label class="checkbox-row"><input type="checkbox" id="ng_deceased" ${n.deceased?'checked':''}> Fallecido/a</label>
      <label class="checkbox-row"><input type="checkbox" id="ng_isPatient" ${n.isPatient?'checked':''}> Paciente identificado</label>
    </div>
    <div class="modal-actions"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" onclick="saveNodeEdit('${nodeId}')">Guardar</button></div>
  `);
}
function saveNodeEdit(nodeId) {
  const p = getPatient(currentPatientId);
  const n = p.genogram.nodes.find(x => x.id === nodeId); if (!n) return;
  n.name = document.getElementById('ng_name').value; n.age = document.getElementById('ng_age').value; n.gender = document.getElementById('ng_gender').value;
  n.role = document.getElementById('ng_role').value; n.notes = document.getElementById('ng_notes').value; n.deceased = document.getElementById('ng_deceased').checked;
  const isP = document.getElementById('ng_isPatient').checked; if (isP) p.genogram.nodes.forEach(x => x.isPatient = false); n.isPatient = isP;
  saveData(); closeModal(); drawGenogram();
}
function deleteSelectedNode() {
  if (!genogramState.selectedNodeId) { toast('Seleccioná primero'); return; }
  const p = getPatient(currentPatientId);
  p.genogram.nodes = p.genogram.nodes.filter(n => n.id !== genogramState.selectedNodeId);
  p.genogram.edges = p.genogram.edges.filter(e => e.from !== genogramState.selectedNodeId && e.to !== genogramState.selectedNodeId);
  genogramState.selectedNodeId = null; saveData(); drawGenogram();
}
function clearGenogram() { if (!confirm('¿Borrar todo el genograma?')) return; const p = getPatient(currentPatientId); p.genogram = { nodes: [], edges: [] }; saveData(); drawGenogram(); }

function exportGenogramImage(returnBlob) {
  return new Promise((resolve) => {
    const svg = document.getElementById('genogramCanvas');
    if (!svg) { resolve(null); return; }
    const svgData = new XMLSerializer().serializeToString(svg);
    const svgBlob = new Blob(['<?xml version="1.0" encoding="UTF-8"?>' + svgData], { type: 'image/svg+xml' });
    const url = URL.createObjectURL(svgBlob);
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement('canvas');
      canvas.width = 2000; canvas.height = 1200;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      URL.revokeObjectURL(url);
      canvas.toBlob((blob) => {
        if (returnBlob) resolve(blob);
        else { const p = getPatient(currentPatientId); saveAs(blob, `genograma_${sanitize(p.personal.name)}.png`); resolve(blob); }
      }, 'image/png');
    };
    img.src = url;
  });
}

function renderGoals(el, p) {
  const statusLabels = { pending: 'Pendiente', in_progress: 'En progreso', achieved: 'Logrado', reformulated: 'Reformulado', archived: 'Archivado' };
  const statusColors = { pending: 'warning', in_progress: 'info', achieved: 'success', reformulated: 'info', archived: 'warning' };
  const total = p.goals.length;
  const achieved = p.goals.filter(g => g.status === 'achieved').length;
  const pct = total > 0 ? Math.round((achieved/total)*100) : 0;

  el.innerHTML = `
    <div class="card">
      <h3>🎯 Objetivos del tratamiento</h3>
      <p style="color: var(--text-light); font-size: 13.5px; line-height: 1.6; margin-bottom: 14px;">Definí objetivos claros al inicio del proceso y actualizá su estado a medida que avanza. Te ayuda a vos (y al paciente, si se lo mostrás) a ver lo invisible del progreso.</p>
      ${total > 0 ? `
        <div style="margin-bottom: 16px;">
          <div style="display: flex; justify-content: space-between; margin-bottom: 6px; font-size: 13px;">
            <span><strong>${achieved}</strong> logrados de ${total} objetivos</span><span>${pct}%</span>
          </div>
          <div class="progress-bar"><div class="progress-fill" style="width: ${pct}%;"></div></div>
        </div>
      ` : ''}
      <button class="btn btn-primary" onclick="addGoal()">+ Nuevo objetivo</button>
    </div>

    ${p.goals.length === 0 ? '<p style="color: var(--text-light); text-align: center; padding: 40px;">Aún no hay objetivos cargados. Ejemplos: "reducir crisis de pánico", "mejorar vínculo con hija", "trabajar duelo por mamá", "sostener límites laborales".</p>' :
      p.goals.map(g => `<div class="card">
        <div class="session-item-header">
          <div style="flex: 1;">

  const h = document.getElementById('tpl_hora').value; if (h) msg = msg.replace(/\{hora\}/g, h);

  const pid = document.getElementById('tpl_patient').value;

  window.open(`https://wa.me/${phone}?text=${encodeURIComponent(msg)}`, '_blank');

function downloadBackup() {

  toast('✓ Backup descargado');
}
function restoreBackup() {
  const file = document.getElementById('restoreFile').files[0];
  if (!file) { toast('Elegí un archivo primero'); return; }
  if (!confirm('¿Reemplazar todos los datos actuales? Esto no se puede deshacer.')) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const restored = JSON.parse(e.target.result);
      migrateData(restored); data = restored; saveData();
      closeModal(); renderSidebar(); renderMain();
      toast('✓ Backup restaurado');
    } catch(err) { toast('Error al restaurar: archivo inválido'); }
  };
  reader.readAsText(file);
}

async function exportCurrentPatient() {
  const p = getPatient(currentPatientId); if (!p) return;
  if (!p.personal.name || p.personal.name === 'Nuevo paciente') {
    toast('Cargá el nombre del paciente antes de exportar');
    selectTab('personal'); return;
  }
  toast('Generando archivos...');
  const zip = new JSZip();
  const folderName = 'paciente_' + sanitize(p.personal.name) + '_' + new Date().toISOString().split('T')[0];
  const folder = zip.folder(folderName);
  const docxBlob = await buildDocx(p);
  folder.file('1_Historia_clinica.docx', docxBlob);
  const xlsxBlob = buildXlsx(p);
  folder.file('2_Sesiones_y_pagos.xlsx', xlsxBlob);
  if (p.genogram.nodes.length > 0) {
    const prev = currentTab; currentTab = 'genogram'; renderPatient(document.getElementById('mainContent'));
    await new Promise(r => setTimeout(r, 300));
    const pngBlob = await exportGenogramImage(true);
    if (pngBlob) folder.file('3_Genograma.png', pngBlob);
    currentTab = prev; renderPatient(document.getElementById('mainContent'));
  }
  const readme = `Paciente: ${p.personal.name}\nExportado: ${new Date().toLocaleString('es-AR')}\nProfesional: ${data.settings.therapistName || '(sin especificar)'}\n\nContenido:\n- 1_Historia_clinica.docx (datos, anamnesis, sesiones, evoluciones)\n- 2_Sesiones_y_pagos.xlsx (planilla)\n${p.genogram.nodes.length > 0 ? '- 3_Genograma.png\n' : ''}\nPara Google Drive:\n1. Entrá a drive.google.com\n2. Creá carpeta con nombre del paciente\n3. Arrastrá los archivos\n4. Click derecho > "Abrir con Google Docs/Sheets" para convertirlos.`;
  folder.file('LEEME.txt', readme);
  const zipBlob = await zip.generateAsync({type: 'blob'});
  saveAs(zipBlob, folderName + '.zip');
  toast('✓ ZIP descargado');
}

async function buildDocx(p) {
  const { Document, Packer, Paragraph, TextRun, HeadingLevel, AlignmentType } = docx;
  const children = [];
  const h = (t, level=HeadingLevel.HEADING_1) => new Paragraph({text: t, heading: level, spacing: {before: 200, after: 100}});
  const par = (t) => new Paragraph({children: [new TextRun({text: t||'—'})], spacing: {after: 80}});
  const fp = (l, v) => new Paragraph({children: [new TextRun({text: l + ': ', bold: true}), new TextRun({text: v||'—'})], spacing: {after: 80}});
  children.push(new Paragraph({text: 'Historia clínica', heading: HeadingLevel.TITLE, alignment: AlignmentType.CENTER}));
  children.push(new Paragraph({text: p.personal.name, alignment: AlignmentType.CENTER, spacing: {after: 300}}));
  children.push(h('1. Datos personales'));
  const pe = p.personal;
  [['Nombre',pe.name],['Fecha de nacimiento',pe.dob],['Género',pe.gender],['Documento',pe.document],['Teléfono',pe.phone],['Email',pe.email],['Dirección',pe.address],['Ocupación',pe.occupation],['Estudios',pe.education],['Estado civil',pe.maritalStatus],['Derivado por',pe.referredBy]].forEach(([l,v])=>children.push(fp(l,v)));
  children.push(h('2. Motivo de consulta'));
  children.push(par(pe.motiveOfConsultation));
  children.push(h('3. Anamnesis'));
  const a = p.anamnesis;
  [['Antecedentes personales',a.personalBg],['Antecedentes familiares',a.familyBg],['Desarrollo',a.developmentalHistory],['Escolares',a.schoolBg],['Laborales',a.workBg],['Médicos',a.medicalBg],['Psiquiátricos',a.psychiatricBg],['Medicación',a.currentMedication],['Sustancias',a.substanceUse],['Eventos significativos',a.significantEvents],['Red de apoyo',a.socialSupport],['Hobbies',a.hobbies]].forEach(([l,v])=>{children.push(h(l,HeadingLevel.HEADING_2));children.push(par(v));});
  children.push(h('4. Sesiones'));
  if (!p.sessions.length) children.push(par('Sin sesiones.'));
  for (const s of p.sessions) {
    children.push(h(`Sesión ${formatDate(s.date)} ${s.time||''}`, HeadingLevel.HEADING_2));
    [['Duración',(s.duration||50)+' min'],['Notas',s.notes],['Intervenciones',s.interventions],['Tareas',s.homework],['Monto',money(s.amount||0)],['Estado',s.paid?'Pagada':'Pendiente']].forEach(([l,v])=>children.push(fp(l,v)));
  }
  if (p.evolutionNotes?.length) {
    children.push(h('5. Notas de evolución (Ley 26.529)'));
    p.evolutionNotes.forEach((n,i) => {
      children.push(h(`Nota N° ${i+1} — ${formatDate(n.date)}`, HeadingLevel.HEADING_2));
      [['Modalidad',n.modality],['Motivo',n.motive],['Contenido',n.content],['Intervenciones',n.interventions],['Plan',n.plan]].forEach(([l,v])=>children.push(fp(l,v)));
    });
  }
  if (p.evaluations.length > 0) {
    children.push(h('6. Evaluaciones'));
    for (const e of p.evaluations) {
      children.push(h(`${e.testName||'Evaluación'} — ${formatDate(e.date)}`, HeadingLevel.HEADING_2));
      children.push(fp('Resultados', e.results)); children.push(fp('Observaciones', e.observations));
    }
  }
  const doc = new Document({sections: [{children}]});
  return await Packer.toBlob(doc);
}

function buildXlsx(p) {
  const wb = XLSX.utils.book_new();
  const sData = [['Fecha','Hora','Duración','Notas','Intervenciones','Tareas','Monto','Pagada','Comisión']];
  for (const s of p.sessions) sData.push([s.date, s.time||'', s.duration||50, s.notes||'', s.interventions||'', s.homework||'', s.amount||0, s.paid?'Sí':'No', s.commissionPaid?'Sí':(data.settings.isInNetwork?'No':'-')]);
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(sData), 'Sesiones');
  const paid = p.sessions.filter(s=>s.paid).reduce((sum,s)=>sum+(s.amount||0),0);
  const pending = p.sessions.filter(s=>!s.paid).reduce((sum,s)=>sum+(s.amount||0),0);
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([['Concepto','Monto'],['Total cobrado',paid],['Total pendiente',pending],['Total facturado',paid+pending],['Cantidad sesiones',p.sessions.length]]), 'Resumen');
  if (p.evaluations.length > 0) {
    const ed = [['Fecha','Test','Resultados','Observaciones']];
    for (const e of p.evaluations) ed.push([e.date, e.testName, e.results, e.observations]);
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(ed), 'Evaluaciones');
  }
  const out = XLSX.write(wb, {bookType: 'xlsx', type: 'array'});
  return new Blob([out], {type: 'application/octet-stream'});
}
